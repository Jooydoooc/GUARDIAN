<!-- Login Page -->
<div id="login-page" class="page active">
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-book-reader"></i>
            <h1>Reading Platform</h1>
            <p class="subtitle">Learn English through interesting articles</p>
        </div>
        
        <form id="login-form" class="checklist-form">
            <!-- Field 1: Name -->
            <div class="checklist-item">
                <div class="checklist-header">
                    <span class="checkbox unchecked">☐</span>
                    <label for="name" class="checklist-label">Name</label>
                </div>
                <input type="text" 
                       id="name" 
                       class="checklist-input"
                       placeholder="Type your name"
                       required>
            </div>
            
            <!-- Field 2: Surname -->
            <div class="checklist-item">
                <div class="checklist-header">
                    <span class="checkbox checked">☑</span>
                    <label for="surname" class="checklist-label">Surname</label>
                </div>
                <input type="text" 
                       id="surname" 
                       class="checklist-input"
                       placeholder="Type your surname"
                       required>
            </div>
            
            <!-- Field 3: Group (MANUAL INPUT) -->
            <div class="checklist-item">
                <div class="checklist-header">
                    <span class="checkbox checked">☑</span>
                    <label for="group" class="checklist-label">Group</label>
                </div>
                <input type="text" 
                       id="group" 
                       class="checklist-input"
                       placeholder="Type your group (e.g., A1, B2, etc.)"
                       required>
                <small class="input-hint">Example: A1, A2, B1, B2, C1, C2</small>
            </div>
            
            <!-- Field 4: Time (Auto-filled) -->
            <div class="checklist-item">
                <div class="checklist-header">
                    <span class="checkbox unchecked">☐</span>
                    <label class="checklist-label">Time</label>
                </div>
                <div id="current-time" class="time-display">Loading time...</div>
                <small class="input-hint">Automatically set</small>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="btn btn-submit">
                <i class="fas fa-sign-in-alt"></i> Enter Platform
            </button>
        </form>
        
        <div class="footer-note">
            <p><i class="fas fa-info-circle"></i> Your progress will be saved automatically</p>
        </div>
    </div>
</div>
